[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairndev"
version = "0.1.0"
description = "Design-quality control plugin for agentic software development"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
cairndev = "cairndev.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
